name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lms_test
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore LMS/LMS.sln

      - name: Build
        run: dotnet build LMS/LMS.sln --no-restore --configuration Release

      - name: Unit tests + coverage
        run: |
          dotnet test LMS/LMS.Tests \
            --filter Category=Unit \
            --collect:"XPlat Code Coverage" \
            --no-build \
            --configuration Release \
            --results-directory ./coverage

      - name: Coverage gate (80%)
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage/report" \
            -reporttypes:TextSummary
          cat coverage/report/Summary.txt
          LINE=$(grep -oP 'Line coverage: \K[0-9]+' coverage/report/Summary.txt || echo "0")
          echo "Line coverage: ${LINE}%"
          if [ "$LINE" -lt 80 ]; then
            echo "FAIL: coverage ${LINE}% is below 80% gate"
            exit 1
          fi

      - name: Integration tests
        run: |
          dotnet test LMS/LMS.Tests \
            --filter Category=Integration \
            --no-build \
            --configuration Release
        env:
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=lms_test;
            Username=lms;Password=lms_test_pass

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript type-check
        run: cd frontend && npx tsc --noEmit

      - name: Lint
        run: cd frontend && npm run lint

      - name: Unit tests
        run: cd frontend && npm run test -- --run --reporter=verbose
